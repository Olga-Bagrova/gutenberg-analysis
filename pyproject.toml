[project]
name = "gutenberg-analysis"
version = "0.1.0"
description = "A cumulative research project analyzing Project Gutenberg word distributions"
requires-python = ">=3.12"
dependencies = [
    "polars>=1.44.2",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
extend-select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort import sorting
    "D",    # pydocstyle docstring conventions
    "UP",   # pyupgrade modern Python syntax
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"
